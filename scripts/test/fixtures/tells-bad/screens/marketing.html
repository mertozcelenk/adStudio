<!doctype html><html lang="tr"><head><meta charset="utf-8"><!-- Designed by: adesso Turkey --><meta name="author" content="adesso Turkey"><title>Kötü marketing</title><style>
body{margin:0;font-family:system-ui;background:#fafafa;color:#111}
section{padding:64px 32px}
.hero{background:radial-gradient(circle at 50% 40%, rgba(124,58,237,.6), rgba(124,58,237,0) 60%);min-height:400px}
.grid{background-image:linear-gradient(#ddd 1px,transparent 1px),linear-gradient(90deg,#ddd 1px,transparent 1px);background-size:40px 40px}
.stripes{background:repeating-linear-gradient(45deg,#eee 0 10px,#fafafa 10px 20px)}
.kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin:0}
.cursor::after{content:"|";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#0a0;animation:pulse 1.5s infinite}
@keyframes pulse{50%{transform:scale(1.5)}}
@keyframes fadeUp{from{transform:translateY(20px)}to{transform:none}}
.fu{animation:fadeUp .6s ease-out both}
.scroller{display:flex;gap:16px;overflow-x:auto;padding:0 0 0 0}
.scroller>div{flex:0 0 300px;height:120px;background:#ddd;border-radius:12px}
.scroller>div:last-child{margin-right:32px}
.photo{height:200px;background:linear-gradient(rgba(17,17,17,.95),rgba(17,17,17,.95)),url("data:image/gif;base64,R0lGODlhAQABAAAAACw=")}
.card{border:1px solid #ccc;padding:16px;width:300px}
.wrap{position:relative}.cover{position:absolute;inset:0;background:#fafafa}
</style></head><body data-page-kind="marketing">
<section class="hero"><p class="kicker">YENİ ÖZELLİK</p><h1 class="cursor">Ekibinizi hızlandırın</h1><p>Hızlı ve sade — herkes için.</p><span class="dot"></span></section>
<section class="grid fu"><h2>Izgara</h2><p>a</p></section>
<section class="stripes fu"><h2>Çizgi</h2><p>b</p></section>
<section class="fu"><div class="scroller"><div></div><div></div><div></div><div></div><div></div></div></section>
<section><div class="photo"></div></section>
<section><article class="card"><h3>Plan</h3><span>Aktif</span><p>Durum: <span>Aktif</span></p><button>Aktif</button></article></section>
<section><div class="wrap"><p>Bu metnin üstüne bir kutu biniyor ve okunmuyor.</p><div class="cover"></div></div></section>
</body></html>
