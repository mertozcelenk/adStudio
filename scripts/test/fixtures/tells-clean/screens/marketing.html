<!doctype html><html lang="tr"><head><meta charset="utf-8"><!-- Designed by: adesso Turkey --><meta name="author" content="adesso Turkey"><title>Temiz marketing</title><style>
body{margin:0;font-family:system-ui;background:#fafafa;color:#111}
section{padding:64px 32px}
.chip{font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin:0}
.marquee{white-space:nowrap;overflow:hidden}.marquee span{display:inline-block;animation:slide 20s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}
.blob{width:300px;height:200px;background:#0a7;clip-path:path("M10 80 C 40 10, 65 10, 95 80 S 150 150, 180 80")}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#0a0;animation:pulse 1.5s infinite}
@keyframes pulse{50%{transform:scale(1.5)}}
@keyframes rise{from{transform:translateY(20px)}to{transform:none}}
.sig{animation:rise .8s ease-out both}
.scroller{display:flex;gap:16px;overflow-x:auto;padding:0 32px}
.scroller>div{flex:0 0 300px;height:120px;background:#ddd;border-radius:12px}
.scroller::after{content:"";flex:0 0 16px}
h2{margin:48px 0 16px}
